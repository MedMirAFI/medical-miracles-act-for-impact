    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: #0B132B;
            --emerald-bright: #10B981;
            --emerald-glow: rgba(16, 185, 129, 0.25);
            --gold-glow: #FBBF24;
            --soft-gold: #FDE68A;
            --accent-red: #EF4444;
            --text-light: #F9FAFB;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            scroll-behavior: smooth;
        }
        h1, h2, h3, h4, .font-heading { font-family: 'Space Grotesk', sans-serif; }
        .starfield {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 60px 60px; opacity: 0.12; z-index: -1;
        }
        .glow-emerald { box-shadow: 0 0 25px var(--emerald-glow); }
        .btn-base { transition: all 0.2s ease-in-out; }
        .btn-base:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-emerald { background-color: var(--emerald-bright); color: #030712; }
        .tab-btn.active { border-color: var(--emerald-bright); color: var(--emerald-bright); font-weight: 700; background-color: rgba(16, 185, 129, 0.1); }
        .strict-ban { border: 2px solid var(--accent-red); background-color: rgba(239, 68, 68, 0.08); }
        .notice-card { border: 1px solid rgba(251, 191, 36, 0.3); background-color: rgba(251, 191, 36, 0.05); }
        .insta-card { border: 1px solid rgba(236, 72, 153, 0.3); background-color: rgba(236, 72, 153, 0.05); }

        /* Refined Subtle Halo Shimmer */
        @keyframes shimmer-halo {
            0% { filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.4)); opacity: 0.9; }
            50% { filter: drop-shadow(0 0 22px rgba(253, 230, 138, 0.8)); opacity: 1; }
            100% { filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.4)); opacity: 0.9; }
        }
        .angelic-halo { animation: shimmer-halo 3s infinite ease-in-out; }

        @keyframes wing-float {
            0%, 100% { transform: translateY(0px); filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.2)); }
            50% { transform: translateY(-3px); filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.5)); }
        }
        .angelic-wings { animation: wing-float 4s infinite ease-in-out; }
    </style>
</head>
