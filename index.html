<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Miracles: Act for Impact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light-blue: #E0F2FE;
            --emerald-bright: #0284C7;
            --accent-red: #DC2626;
            --text-dark: #0F172A;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light-blue);
            color: var(--text-dark);
            scroll-behavior: smooth;
        }
        h1, h2, h3, h4, .font-heading { font-family: 'Space Grotesk', sans-serif; }
        .starfield {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#0284C7 1px, transparent 1px);
            background-size: 60px 60px; opacity: 0.15; z-index: -1;
        }
        .btn-base { transition: all 0.2s ease-in-out; }
        .btn-base:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn-emerald { background-color: #0284C7; color: #FFFFFF; }
        
        .tab-btn.active { border-color: #0284C7; color: #0284C7; font-weight: 700; background-color: rgba(2, 132, 199, 0.1); }
        
        .strict-ban { border: 2px solid var(--accent-red); background-color: rgba(220, 38, 38, 0.05); }
        .notice-card { border: 1px solid rgba(217, 119, 6, 0.3); background-color: rgba(254, 243, 199, 0.6); }
        .insta-card { border: 1px solid rgba(236, 72, 153, 0.3); background-color: rgba(252, 231, 243, 0.6); }

        @keyframes shimmer-halo {
            0% { filter: drop-shadow(0 0 10px rgba(217, 119, 6, 0.4)); opacity: 0.9; }
            50% { filter: drop-shadow(0 0 22px rgba(245, 158, 11, 0.8)); opacity: 1; }
            100% { filter: drop-shadow(0 0 10px rgba(217, 119, 6, 0.4)); opacity: 0.9; }
        }
        .angelic-halo { animation: shimmer-halo 3s infinite ease-in-out; }

        @keyframes wing-float {
            0%, 100% { transform: translateY(0px); filter: drop-shadow(0 0 10px rgba(217, 119, 6, 0.2)); }
            50% { transform: translateY(-3px); filter: drop-shadow(0 0 20px rgba(217, 119, 6, 0.4)); }
        }
        .angelic-wings { animation: wing-float 4s infinite ease-in-out; }
    </style>
</head>
<body class="relative min-h-screen">
    <div class="starfield"></div>

    <!-- Navigation Header -->
    <header class="bg-white/90 sticky top-0 z-50 border-b border-sky-200 backdrop-blur-md shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex
